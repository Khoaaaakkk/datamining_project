data:
  raw_wsi_dir: data/raw_wsi
  h5_features_dir: data/h5_features
  masks_dir: data/masks

system:
  # Optional: Windows OpenSlide DLL directory
  openslide_dll_dir: tools/openslide/bin/openslide-bin-4.0.0.13-windows-x64/bin

preprocessing:
  patch_size: 256
  step_size: 256
  seg_level: 2
  tissue_threshold: 0.2
  max_white_ratio: 0.7
  min_laplacian_var: 50.0
  use_stain_normalization: false
  reference_image: data/reference/normalizer_target.png

feature_extraction:
  model_name: swin_large_patch4_window7_224
  pretrained: true
  batch_size: 64
  num_workers: 2
  device: cuda
  amp: true

output:
  report_path: experiments/logs/preprocessing_report.json
